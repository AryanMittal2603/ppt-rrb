<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RRB AM-RMS · Application and Recruitment Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#DCE3E1; --paper:#F3F6F4; --sky:#DCECF2; --ink:#142844; --quiet:#637383; --line:#A8BBC2;
  --accent:#B76A3B; --green:#2E7567; --amber:#C9962B; --blue:#2557DA; --white:#FFFFFF; --chrome:#626B75;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#0C1320; --chrome:#8C97A3; } }
:root[data-theme="dark"]{ --page:#0C1320; --chrome:#8C97A3; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--page);display:grid;place-items:center;font-family:Archivo,Arial,Helvetica,sans-serif;color:var(--ink);
  cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.mono{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace}

/* ── the stage: a 16:9 sheet of paper; every size inside is in cqw so it scales as one ── */
#deck{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);container-type:inline-size;overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse at 24% 28%,#FFFFFF 0%,#F7F8F5 34%,transparent 58%),linear-gradient(124deg,var(--paper) 0 63%,#E8F1F3 63% 100%)}
#deck:before{content:"";position:absolute;inset:-18%;z-index:0;pointer-events:none;opacity:.78;
  background:radial-gradient(circle at 79% 31%,#B8D9E4 0 8%,transparent 26%),radial-gradient(circle at 88% 76%,#D9BFAF 0 6%,transparent 24%);filter:blur(4cqw)}
#deck:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;box-shadow:inset 0 0 8cqw .5cqw rgba(20,40,68,.065)}

/* header, quiet, on every page but the cover */
.hdr{position:absolute;left:7.2cqw;right:7.2cqw;top:2.4cqw;z-index:7;display:flex;justify-content:space-between;align-items:center;
  font:600 .82cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--quiet);transition:opacity .5s}
.hdr b{color:var(--ink);font-weight:600}
.hdr .tk{display:inline-flex;gap:.6cqw;align-items:center}
.hdr .tk svg{width:2.2cqw;height:1cqw}
.rule{position:absolute;left:7.2cqw;right:7.2cqw;top:4.6cqw;height:1px;background:linear-gradient(90deg,#1428442a,#1428440a);z-index:7;transition:opacity .5s}
#deck.cover .hdr,#deck.cover .rule{opacity:0}

/* slides */
.slide{position:absolute;inset:0;z-index:2;opacity:0;visibility:hidden;transform:translateX(3%) scale(.985);filter:blur(3px);
  transition:opacity .55s cubic-bezier(.22,.61,.36,1),transform .7s cubic-bezier(.16,1,.3,1),filter .5s,visibility 0s linear .6s}
.slide.on{opacity:1;visibility:visible;transform:none;filter:none;z-index:3;
  transition:opacity .55s cubic-bezier(.22,.61,.36,1) .2s,transform .8s cubic-bezier(.16,1,.3,1) .15s,filter .5s .15s,visibility 0s}
.slide.off{visibility:visible;transform:translateX(-2.6%) scale(.988)}
.slide svg.over{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
canvas.field{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}

/* type */
.kicker{position:absolute;left:7.2cqw;top:6.9cqw;display:flex;align-items:center;gap:.9cqw;z-index:5;white-space:nowrap;
  font:600 .96cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.kicker:before{content:"";width:3.3cqw;height:2px;background:currentColor}
.h1{position:absolute;left:7.2cqw;top:8.7cqw;width:86cqw;margin:0;z-index:5;white-space:nowrap;
  font-size:3.2cqw;line-height:1.08;letter-spacing:-.04cqw;font-weight:800;color:var(--ink)}
.h1 em,.lab em,.outcome em,.big em{font-style:normal;color:var(--green)}
.lab{position:absolute;z-index:5;font-weight:800;font-size:1.3cqw;line-height:1.12;letter-spacing:-.01cqw;color:var(--ink)}
.lab small,.sub{display:block;margin-top:.3cqw;font:600 .8cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--quiet);line-height:1.45}
.txt{font-size:1.18cqw;line-height:1.38;color:var(--ink)}
.q{color:var(--quiet)}
.outcome{position:absolute;left:7.2cqw;top:47.6cqw;width:80cqw;z-index:5;font-size:1.62cqw;line-height:1.2;font-weight:800;letter-spacing:-.013cqw;color:var(--ink)}
.outcome small{display:block;margin-top:.45cqw;font:600 .8cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.c-amber{color:var(--amber)}.c-blue{color:var(--blue)}.c-green{color:var(--green)}.c-rust{color:var(--accent)}.c-quiet{color:var(--quiet)}

/* ── motion vocabulary: everything waits for .play, then runs on its own --d ── */
.a{opacity:0}
.play .a{animation:in .9s cubic-bezier(.16,1,.3,1) var(--d,0s) both}
.play .a.l{animation-name:inL}.play .a.r{animation-name:inR}.play .a.pop{animation-name:pop;animation-duration:.6s}
@keyframes in{from{opacity:0;translate:0 .9cqw;filter:blur(4px)}to{opacity:1;translate:0 0;filter:none}}
@keyframes inL{from{opacity:0;translate:2cqw 0;filter:blur(4px)}to{opacity:1;translate:0 0;filter:none}}
@keyframes inR{from{opacity:0;translate:-2cqw 0;filter:blur(4px)}to{opacity:1;translate:0 0;filter:none}}
@keyframes pop{0%{opacity:0;scale:.4}70%{opacity:1;scale:1.12}100%{opacity:1;scale:1}}
.rise .w{display:inline-block;opacity:0}
.play .rise .w{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(.55em);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.dr{stroke-dasharray:1;stroke-dashoffset:1}
.play .dr{animation:draw var(--t,1.2s) cubic-bezier(.65,0,.35,1) var(--d,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gx{transform:scaleX(0);transform-origin:left center}
.play .gx{animation:gx var(--t,1s) cubic-bezier(.65,0,.35,1) var(--d,0s) forwards}
@keyframes gx{to{transform:scaleX(1)}}
.gy{transform:scaleY(0);transform-origin:center bottom;transform-box:fill-box}
.play .gy{animation:gy var(--t,.9s) cubic-bezier(.16,1,.3,1) var(--d,0s) forwards}
@keyframes gy{to{transform:scaleY(1)}}
.gyd{transform:scaleY(0);transform-origin:top center}
.play .gyd{animation:gy var(--t,1s) cubic-bezier(.65,0,.35,1) var(--d,0s) forwards}
/* final frame: End key, or reduced motion */
.done .sdot,.done .stn,.done .mdot,.done .row svg,.done .a,.done .rise .w,.done .dr,.done .gx,.done .gy,.done .gyd,.done .fx{animation-duration:.001s!important;animation-delay:0s!important}
.done .sweepline,.done .jtrain,.done .train,.done .ticket{animation:none!important;opacity:0}
@media (prefers-reduced-motion:reduce){.slide,.slide.on{transition:opacity .2s}}

/* the curtain: a sheet of the same paper sweeps across between pages */
.curtain{position:absolute;inset:0;z-index:20;pointer-events:none;transform:translateX(-102%);
  background:linear-gradient(100deg,#F3F6F4 0%,#F3F6F4 52%,#E2EEF1 78%,#ECDDD3 100%);box-shadow:8px 0 30px #14284418}
.curtain:after{content:"";position:absolute;top:0;bottom:0;right:15%;width:2px;background:linear-gradient(180deg,transparent,#B76A3B 18% 82%,transparent);box-shadow:0 0 22px #B76A3B55}
.curtain.sweep{animation:sweep .9s cubic-bezier(.65,0,.35,1) forwards}
.curtain.back{animation:sweepBack .9s cubic-bezier(.65,0,.35,1) forwards}
@keyframes sweep{from{transform:translateX(-102%)}to{transform:translateX(102%)}}
@keyframes sweepBack{from{transform:translateX(102%)}to{transform:translateX(-102%)}}
/* chapter card between parts */
.film{position:absolute;inset:0;z-index:19;display:grid;place-items:center;pointer-events:none;opacity:0;color:var(--ink);
  background:radial-gradient(circle at 72% 30%,#DCECF2 0,transparent 34%),linear-gradient(124deg,#F7F8F5 0 63%,#E8F1F3 63% 100%)}
.film.on{animation:film 1.7s cubic-bezier(.22,.61,.36,1) both}
@keyframes film{0%{opacity:0}14%{opacity:1}74%{opacity:1}100%{opacity:0}}
.film .cp{width:54%}
.film .ph{font:600 1.05cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.6cqw}
.film .tt{font-weight:800;font-size:3.6cqw;line-height:1.06;letter-spacing:-.05cqw}
.film .tr{position:relative;height:2px;margin-top:1.4cqw;background:#1428441c}
.film .tr i{position:absolute;inset:0;background:var(--green);transform-origin:left;transform:scaleX(0)}
.film.on .tr i{animation:gx .9s cubic-bezier(.16,1,.3,1) .25s forwards}

/* chrome */
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#2E343C14;z-index:21}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.count{position:absolute;right:2cqw;bottom:1.3cqw;z-index:21;font:600 .86cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.14em;color:#626B75;font-variant-numeric:tabular-nums;transition:opacity .4s}
.keys{position:absolute;left:50%;bottom:1.3cqw;transform:translateX(-50%);z-index:21;display:flex;gap:1.4cqw;font:500 .8cqw Archivo,Arial,sans-serif;color:#626B75;white-space:nowrap;transition:opacity .5s}
.keys b{color:#2E343C;font-weight:700}
.idle .keys,.idle .count{opacity:0}
.navbtn{position:absolute;bottom:.9cqw;z-index:22;width:2.6cqw;height:2.6cqw;border-radius:50%;border:1px solid #14284422;background:#FFFFFFB0;color:var(--ink);
  font:700 1.2cqw Archivo,Arial,sans-serif;display:grid;place-items:center;cursor:pointer;opacity:.0;transition:opacity .3s}
.navbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;opacity:1}
#deck:hover .navbtn{opacity:.85}.idle .navbtn{opacity:0!important}
#prevBtn{left:1.6cqw}#nextBtn{left:4.6cqw}

/* ── page specifics ── */
/* 1 cover */
.cv .kicker{top:9.6cqw}
.cv .h1{top:11.6cqw;font-size:5.1cqw;line-height:.98;letter-spacing:-.08cqw;white-space:normal;width:50cqw}
.cv .h1 > span{display:block}
.cv .promise{position:absolute;left:7.2cqw;top:30.6cqw;width:46cqw;z-index:5;font-size:2.2cqw;font-weight:800;line-height:1.1;letter-spacing:-.03cqw}
.cv .objective{position:absolute;left:7.2cqw;top:39.6cqw;width:42cqw;z-index:5;font:600 .9cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;line-height:1.6;color:var(--quiet)}
.cv .objective b{color:var(--ink);font-weight:600}
.cv .foot{position:absolute;left:7.2cqw;top:49.2cqw;z-index:5;display:flex;gap:1.2cqw;font:600 .9cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--quiet)}
.cv .foot b{color:var(--ink);font-weight:600}

/* stat block */
.stat{position:absolute;z-index:5}
.stat .n{font-weight:800;font-size:3.7cqw;line-height:1;letter-spacing:-.06cqw;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .n small{font-size:.5em;letter-spacing:0;margin-left:.2em}
.stat .d{margin-top:.6cqw;font-size:1.08cqw;line-height:1.35;color:var(--quiet)}
.stat .hl{height:2px;background:var(--ink);margin-bottom:1.1cqw;opacity:.85}

.li{position:absolute;z-index:5;display:flex;gap:.9cqw;align-items:center;font-size:1.2cqw;line-height:1.3;color:var(--ink)}
.li svg{flex:none;width:1.9cqw;height:1.9cqw;overflow:visible}

/* lanes */
.lane{position:absolute;top:16.6cqw;width:19.8cqw;z-index:5}
.lane .hd{display:flex;gap:.8cqw;align-items:flex-start}
.lane .dot{flex:none;width:1.25cqw;height:1.25cqw;border-radius:50%;margin-top:.35cqw}
.lane .nm{font-weight:800;font-size:1.75cqw;line-height:1}
.lane .vr{position:absolute;left:.58cqw;top:4.2cqw;width:2px;height:23cqw;background:#14284420}
.lane ul{list-style:none;margin:2.1cqw 0 0;padding:0 0 0 2cqw}
.lane li{font-size:1.2cqw;line-height:1.3;margin-bottom:1.15cqw;position:relative}
.lane li:before{content:"";position:absolute;left:-1.62cqw;top:.62cqw;width:.85cqw;height:2px;background:currentColor;opacity:.35}

/* journey */
.band{position:absolute;top:17cqw;height:2.3cqw;border-radius:.4cqw;display:flex;align-items:center;justify-content:center;z-index:5;
  font:600 .82cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:#fff;white-space:nowrap}
.band.eca{background:transparent;border:1.5px dashed var(--quiet);color:var(--quiet)}
.stn{position:absolute;top:24.2cqw;width:2.6cqw;height:2.6cqw;margin-left:-1.3cqw;border-radius:50%;z-index:6;display:grid;place-items:center;
  background:var(--paper);border:2px solid var(--ink);font:700 1cqw Archivo,Arial,sans-serif;color:var(--ink)}
.play .stn{animation:lit .5s ease var(--d) forwards}
@keyframes lit{to{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.08)}}
.stl{position:absolute;top:28.6cqw;width:9.8cqw;margin-left:-4.9cqw;text-align:center;z-index:5}
.stl b{display:block;font-weight:800;font-size:1.2cqw;line-height:1.15}
.stl span{display:block;margin-top:.45cqw;font-size:.98cqw;line-height:1.35;color:var(--quiet)}
.train{position:absolute;top:24.75cqw;left:3cqw;width:3.6cqw;height:1.5cqw;border-radius:.75cqw .3cqw .3cqw .75cqw;background:var(--ink);z-index:7;opacity:0;
  box-shadow:0 .3cqw .8cqw #14284433}
.train:after{content:"";position:absolute;right:.35cqw;top:.35cqw;width:.8cqw;height:.8cqw;border-radius:50%;background:var(--amber);box-shadow:0 0 1cqw var(--amber)}
.play .train{animation:run 6.4s cubic-bezier(.45,0,.55,1) 1.2s forwards}
@keyframes run{0%{opacity:0;left:3cqw}6%{opacity:1}94%{opacity:1}100%{opacity:0;left:94cqw}}
.always{position:absolute;left:7.2cqw;top:40.6cqw;width:85.6cqw;z-index:5;border-top:1px solid #14284422;padding-top:1.2cqw;display:flex;gap:2cqw;align-items:baseline}
.always b{flex:none;font-weight:800;font-size:1.3cqw}
.always span{font-size:1.15cqw;color:var(--ink);line-height:1.4}

/* integrations */
.node{position:absolute;z-index:6;width:19cqw}
.node b{display:block;font-weight:800;font-size:1.3cqw;line-height:1.15}
.node span{display:block;margin-top:.3cqw;font:600 .78cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--quiet)}
.node.lft{text-align:right}
.hub{position:absolute;left:50%;top:31.25cqw;width:13.6cqw;height:13.6cqw;margin:-6.8cqw 0 0 -6.8cqw;border-radius:50%;z-index:6;
  background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 0 0 .5cqw #C9962B33,0 1.5cqw 3cqw #14284433}
.hub b{display:block;font-size:2.2cqw;font-weight:800;letter-spacing:-.03cqw}
.hub small{display:block;font:600 .8cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.14em;color:#B8D9E4;margin-top:.3cqw}
.play .hub{animation:pop .8s cubic-bezier(.16,1,.3,1) .3s both}
.legend{position:absolute;left:50%;transform:translateX(-50%);top:49.6cqw;z-index:5;display:flex;gap:2cqw;font:600 .8cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--quiet);white-space:nowrap}
.legend i{display:inline-block;width:.9cqw;height:.9cqw;border-radius:50%;margin-right:.6cqw;vertical-align:-.1cqw}

/* timeline blocks */
.pin{position:absolute;z-index:6;width:1.5cqw;height:1.5cqw;margin:-.75cqw 0 0 -.75cqw;border-radius:50%;background:var(--accent);box-shadow:0 0 0 .4cqw #B76A3B26}
.tl{position:absolute;z-index:5;width:15.4cqw;margin-left:-7.7cqw}
.tl .t{font:600 1.05cqw "IBM Plex Mono",Consolas,monospace;letter-spacing:.08em;color:var(--accent);margin-bottom:.45cqw}
.tl div{font-size:1.08cqw;line-height:1.32;margin-top:.25cqw}
.tl.up{bottom:calc(56.25cqw - 27.4cqw)}
.tl.dn{top:33.4cqw}

/* roadmap */
.ms{position:absolute;top:22.6cqw;width:16.4cqw;z-index:5}
.ms .ph{font-weight:800;font-size:1.45cqw;line-height:1.1}
.ms ul{list-style:none;margin:.9cqw 0 0;padding:0}
.ms li{font-size:1.1cqw;line-height:1.3;margin-bottom:.7cqw;padding-left:1.1cqw;position:relative}
.ms li:before{content:"";position:absolute;left:0;top:.6cqw;width:.55cqw;height:2px;background:var(--quiet)}
.mt{position:absolute;top:15.6cqw;z-index:5;font-weight:800;font-size:1.8cqw;letter-spacing:-.02cqw}
.mdot{position:absolute;top:20.1cqw;width:1.6cqw;height:1.6cqw;margin-left:0;border-radius:50%;border:2px solid var(--line);background:var(--paper);z-index:6}
.play .mdot{animation:lit .45s ease var(--d) forwards}

/* infra */
.box{position:absolute;z-index:5}
.box .tt{font-weight:800;font-size:1.65cqw}
.box ul{list-style:none;margin:1cqw 0 0;padding:0}
.box li{font-size:1.18cqw;line-height:1.3;margin-bottom:.65cqw;padding-left:1.2cqw;position:relative}
.box li:before{content:"";position:absolute;left:0;top:.62cqw;width:.6cqw;height:2px;background:currentColor;opacity:.4}
.users{position:absolute;left:7.2cqw;right:7.2cqw;top:15.6cqw;text-align:center;z-index:5;font-weight:800;font-size:1.3cqw}
.users span{font-weight:500;color:var(--quiet)}

/* two sides */
.side{position:absolute;top:16.4cqw;width:38cqw;z-index:5}
.side .who{font-weight:800;font-size:2.5cqw;letter-spacing:-.03cqw}
.side ul{list-style:none;margin:1.8cqw 0 0;padding:0}
.side li{font-size:1.3cqw;line-height:1.3;margin-bottom:1.05cqw;padding-left:1.4cqw;position:relative}
.side li:before{content:"";position:absolute;left:0;top:.5cqw;width:.6cqw;height:.6cqw;border-radius:50%;background:var(--c)}

/* support flow */
.step{position:absolute;top:35.4cqw;width:17cqw;z-index:5}
.step b{display:block;font-weight:800;font-size:1.35cqw}
.step span{display:block;margin-top:.4cqw;font-size:1.08cqw;line-height:1.35;color:var(--quiet)}
.sdot{position:absolute;top:31.6cqw;width:2.2cqw;height:2.2cqw;margin-left:-1.1cqw;border-radius:50%;background:var(--paper);border:2px solid var(--ink);z-index:6;
  display:grid;place-items:center;font:700 .95cqw Archivo,Arial,sans-serif}
.play .sdot{animation:lit .45s ease var(--d) forwards}
.ticket{position:absolute;top:31.85cqw;left:9cqw;width:1.4cqw;height:1.75cqw;margin-left:-.7cqw;border-radius:.25cqw;background:var(--accent);z-index:7;opacity:0}
.ticket:before,.ticket:after{content:"";position:absolute;left:.3cqw;height:.14cqw;background:#ffffffa0}
.ticket:before{top:.5cqw;width:.8cqw}.ticket:after{top:.85cqw;width:.55cqw}
.play .ticket{animation:tk 5s cubic-bezier(.45,0,.55,1) 1.8s forwards}
@keyframes tk{0%{opacity:0;left:9cqw;background:var(--accent)}6%{opacity:1}22%{left:26.6cqw;background:var(--amber)}44%{left:44.2cqw;background:var(--amber)}66%{left:61.8cqw;background:var(--accent)}88%{left:79.4cqw;background:var(--green)}100%{left:79.4cqw;opacity:0;background:var(--green)}}


/* closing page */
#s15 .h1{font-size:4.3cqw;width:58cqw}
#s15 .promise{top:29.4cqw}
/* journey, stage by stage */

{

function place(i, filmed) {
  const prev = at; at = i; clear();
  slides.forEach((s, j) => { s.classList.toggle('on', j === at); s.classList.toggle('off', j === prev && prev !== at); if (j !== at) { s.classList.remove('play','done'); s.querySelectorAll('video.sbs').forEach(v => { try { v.pause(); } catch (e) {} }); } });
  setTimeout(() => slides.forEach(s => s.classList.remove('off')), 700);
  deck.classList.toggle('cover', at === 0 || at === N - 1);
  document.getElementById('bar').style.width = ((at + 1) / N * 100) + '%';
  document.getElementById('count').textContent = String(at + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0');
  markMenu(at);
  try { if (location.hash !== '#' + (at + 1)) history.replaceState(null, '', '#' + (at + 1)); } catch (e) {}
  play(at, filmed ? 1150 : 120);
}

function show(i, animate = true) {
  const t = Math.max(0, Math.min(N - 1, i));
  if (t === at) return;
  if (!animate || at < 0) { place(t, false); return; }
  if (switching) return; switching = true;
  const [chNew, kNew] = chapterOf(t), [chOld] = chapterOf(at);
  const filmed = chNew !== chOld;
  const c = document.getElementById('curtain'); c.classList.remove('sweep','back'); void c.offsetWidth; c.classList.add(t > at ? 'sweep' : 'back');
  if (filmed) { const f = document.getElementById('film'); document.getElementById('filmPh').textContent = 'Part ' + String(kNew).padStart(2,'0') + ' of ' + String(Object.keys(CHAPTERS).length).padStart(2,'0');
    document.getElementById('filmTt').textContent = chNew; f.classList.remove('on'); void f.offsetWidth; setTimeout(() => f.classList.add('on'), 300); }
  setTimeout(() => place(t, filmed), 440);
  setTimeout(() => { switching = false; }, 1000);
}
const next = () => show(at + 1), prev = () => show(at - 1);

/* input */
deck.addEventListener('click', e => { if (e.target.closest('button')) return; wake(); next(); });
document.getElementById('nextBtn').addEventListener('click', e => { e.stopPropagation(); next(); });
document.getElementById('prevBtn').addEventListener('click', e => { e.stopPropagation(); prev(); });
document.body.addEventListener('click', e => { if (!deck.contains(e.target)) { wake(); next(); } });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); let h = true;
  if (k === 'm') { setMenu(!menu.classList.contains('open')); e.preventDefault(); return; }
  if (e.key === 'Escape' && menu.classList.contains('open')) { setMenu(false); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') next();
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prev();
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') { clear(); play(at, 0, true); }
  else if (k === 'r') { clear(); play(at, 0); }
  else if (k === 'f') { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); p?.catch?.(() => {}); }
  else h = false;
  if (h) { e.preventDefault(); wake(); }
});
let tx = 0, ty = 0, tt = 0;
addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now(); }, { passive: true });
addEventListener('touchend', e => { if (menu.contains(e.target)) return; const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) && Date.now() - tt < 700) { e.preventDefault(); dx < 0 ? next() : prev(); } }, { passive: false });
let idle; function wake() { deck.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => deck.classList.add('idle'), 3200); }
addEventListener('mousemove', wake, { passive: true });
addEventListener('resize', () => { const sl = slides[at]; if (sl && sl.querySelector('canvas.field')) { clear(); play(at, 0, true); } });

const fromHash = () => { const n = parseInt((location.hash || '').replace('#', ''), 10); return (n >= 1 && n <= N) ? n - 1 : 0; };
addEventListener('hashchange', () => { const n = fromHash(); if (n !== at) show(n); });
const start = () => { place(fromHash(), false); wake(); };
(document.fonts && document.fonts.ready) ? document.fonts.ready.then(start) : start();
})();
</script>
</body>
