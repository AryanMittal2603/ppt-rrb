<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure QR Generation Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">

    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
          }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.5/axios.min.js" integrity="sha512-TjBzDQIDnc6pWyeM1bhMnDxtWH0QpOXMcVooglXrali/Tj7W569/wd4E8EDjk1CwOAOPSJon1VfcEt1BI4xIrA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* General Layout */
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f1f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            position: relative; /* Needed for absolute positioning of server selector */
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .content-wrapper {
            background: white;
            padding: 2rem;
            display: flex;
            flex-wrap: wrap; /* Allows wrapping on smaller screens */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            max-width: 1200px; /* Max width for the entire container */
            width: 100%;
        }

        /* Server Selector Styles */
        .server-selector {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
        }

        .server-selector label {
            margin-right: 0.5rem;
            font-weight: bold;
            color: #555;
        }

        .server-selector select {
            padding: 0.4rem 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
        }

        /* Form Section */
        .form-section {
            flex: 1; /* Takes available space */
            min-width: 320px; /* Minimum width for the form */
            padding-right: 2rem;
            border-right: 1px solid #f1f4f5;
            margin-right: 2rem; /* Spacing between form and QR display */
        }

        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column; /* Stack sections vertically on small screens */
            }
            .form-section {
                border-right: none;
                padding-right: 0;
                margin-right: 0;
                border-bottom: 1px solid #f1f4f5; /* Separator on small screens */
                padding-bottom: 2rem;
                margin-bottom: 2rem;
            }
        }

        .section-title {
            font-size: 1.5rem;
            letter-spacing: 0.1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
            font-weight: bold;
        }

        .image-upload-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-bottom: 2rem;
            gap: 1.5rem; /* Space between upload items */
        }

        .image-upload-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
        }

        .image-upload-item p {
            margin: 0;
            font-weight: bold;
            color: #555;
            white-space: nowrap; /* Prevent text wrapping */
        }

        .uploaded-image {
            width: 5rem;
            height: 5rem;
            object-fit: contain; /* or 'cover' depending on desired cropping */
            border: 1px solid #eee;
            padding: 0.25rem;
            border-radius: 4px;
        }
        
        .image-upload-item input[type="file"] {
            margin-top: 0.5rem;
            max-width: 150px; /* Limit width of file input */
        }

        /* PureCSS form adjustments */
        .form-input-group .pure-form {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem; /* Space between input fields */
        }

        .pure-form .pure-control-group {
            flex: 1 1 calc(50% - 1rem); /* Two columns on larger screens */
            min-width: 250px; /* Ensure inputs don't get too narrow */
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pure-form input[type="text"],
        .pure-form select {
            flex: 1; /* Take remaining space */
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        .pure-form-aligned .pure-control-group label {
            text-align: right; /* Align labels to the right */
            width: 8em; /* Adjust as needed */
            margin-right: 0.5em;
            font-weight: bold;
            color: #555;
        }
        
        /* Full width for select dropdown */
        .pure-form-aligned select {
            width: auto; /* Override default select width */
        }


        .pure-form-aligned .pure-controls {
            flex: 1 0 100%; /* Make button full width and move below inputs */
            display: flex;
            justify-content: center; /* Center the button */
            margin-top: 1.5rem;
            margin-left: 0; /* Remove left margin from PureCSS */
        }

        .pure-button-primary {
            background-color: #0078e7; /* PureCSS primary blue */
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .pure-button-primary:hover {
            background-color: #005bb5;
        }

        /* QR Display Section */
        .qr-display-section {
            flex: 1;
            min-width: 280px; /* Minimum width for the QR display */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem; /* Space between QR items */
        }

        .qr-display-section h3 {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
            width: 100%;
        }

        .qr-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .qr-item img {
            max-width: 15rem;
            height: auto;
            border: 1px solid #eee;
            padding: 0.5rem;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .qr-item p {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .qr-item button {
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="server-selector">
        <label for="server-env">Server:</label>
        <select id="server-env" v-model="selectedServer">
            <option value="prod">Prod</option>
            <option value="local">Local</option>
        </select>
    </div>

    <div class="main-container">
        <div class="content-wrapper">
            <div class="form-section">
                <p class="section-title">Secure QR Generation Demo</p>

                <div class="image-upload-group">
                    <div class="image-upload-item">
                        <p>Upload Photograph</p>
                        <img class="uploaded-image" :src="'data:image/jpeg;base64,' + form.image" v-if="form.image" alt="Uploaded Photograph">
                        <input type="file" accept="image/*" @change="handleImage">
                    </div>
                    <div class="image-upload-item">
                        <p>Upload Signature</p>
                        <img class="uploaded-image" :src="'data:image/jpeg;base64,' + form.signature" v-if="form.signature" alt="Uploaded Signature">
                        <input type="file" accept="image/*" @change="handleSignature">
                    </div>
                </div>

                <div class="form-input-group">
                    <form class="pure-form pure-form-aligned">
                        <fieldset>
                            <div class="pure-control-group">
                                <label for="name">Name</label>
                                <input id="name" type="text" v-model="form.name" placeholder="Name">
                            </div>
                            <div class="pure-control-group">
                                <label for="fatherName">Father Name</label>
                                <input id="fatherName" type="text" v-model="form.fatherName" placeholder="Father Name">
                            </div>
                            <div class="pure-control-group">
                                <label for="mobile">Mobile</label>
                                <input id="mobile" type="text" v-model="form.mobile" placeholder="Mobile">
                            </div>
                            <div class="pure-control-group">
                                <label for="rollNumber">Roll No.</label>
                                <input id="rollNumber" type="text" v-model="form.rollNumber" placeholder="Roll Number">
                            </div>
                            <div class="pure-control-group">
                                <label for="uniqueIdentifier">Unique Identifier</label>
                                <input id="uniqueIdentifier" type="text" v-model="form.uniqueIdentifier" placeholder="Unique Identifier">
                            </div>
                            <div class="pure-control-group">
                                <label for="dob">DOB</label>
                                <input id="dob" type="text" v-model="form.dob" placeholder="Date of Birth">
                            </div>
                            <div class="pure-control-group">
                                <label for="email">Email</label>
                                <input id="email" type="text" v-model="form.emailAddress" placeholder="Email Address">
                            </div>
                            <div class="pure-control-group">
                                <label for="projectId">Project ID</label>
                                <input id="projectId" type="text" v-model="form.projectId" placeholder="Project ID">
                            </div>
                            <div class="pure-control-group">
                                <label for="centerCode">Center Code</label>
                                <input id="centerCode" type="text" v-model="form.centerCode" placeholder="Center Code">
                            </div>
                            <div class="pure-control-group">
                                <label for="shiftDate">Shift Date</label>
                                <input id="shiftDate" type="text" v-model="form.shiftDate" placeholder="Shift Date (YYYY-MM-DD)">
                            </div>
                            <div class="pure-control-group">
                                <label for="role">Rolee</label>
                                <input id="role" type="text" v-model="form.role" placeholder="Role">
                            </div>
                            <div class="pure-control-group">
                                <label for="qrSetting">QR Setting</label>
                                <select id="qrSetting" v-model="presetSetting">
                                    <option value="" disabled selected>Select QR Setting</option>
                                    <option value="COMPACT">High Quality Picture Only</option>
                                    <option value="COMPACT">Picture + Signature</option>
                                    <option value="TEXT_ONLY">Text Only</option>
                                    <option value="PICTURE_ONLY_SMALL_3X3">Only Picture (Small)</option>
                                </select>
                            </div>
                            <div class="pure-control-group">
                                <label for="maxQRSize">MAX QR Size in bytes (Don't see unless needed)</label>
                                <input id="maxQRSize" type="text" v-model="maxQRSize" placeholder="Optional Max QR Size">
                            </div>
                            <div class="pure-control-group">
                                <label for="qrPartsCount">Number of QR Parts</label>
                                <input id="qrPartsCount" type="text" v-model="qrPartsCount" placeholder="Optional Number of QR To Split default 1">
                            </div>
                            <div class="pure-controls">
                                <button type="button" class="pure-button pure-button-primary" @click="createQR">Generate QR</button>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </div>

            <div class="qr-display-section" v-if="validQRBase64 || showInvalidQrExplicitly || textOnlyQR || personPicture">
                <h3>Generated QR Codes</h3>
                <div class="qr-item" v-if="validQRBase64">
                    <img :src="'data:image/jpeg;base64,' + validQRBase64" alt="Valid QR Code">
                    <p>Valid QR Code</p>
                    <button class="pure-button" @click="showInvalidQR">Show Invalid QR</button>
                </div>
                <div class="qr-item" v-if="invalidQRBase64 && showInvalidQrExplicitly">
                    <img :src="'data:image/jpeg;base64,' + invalidQRBase64" alt="Invalid QR Code">
                    <p>Invalid QR Code</p>
                    <button class="pure-button" @click="showValidQR">Show Valid QR</button>
                </div>
                <div class="qr-item" v-if="textOnlyQR">
                    <img :src="'data:image/jpeg;base64,' + textOnlyQR" alt="Text Only QR Code">
                    <p>Text Only QR Code</p>
                </div>
                <div class="qr-item" v-if="personPicture">
                    <img :src="'data:image/jpeg;base64,' + personPicture" alt="Person Picture">
                    <p>Person Picture</p>
                    <p v-if="score !== null">Score: {{ score }}</p> </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { createApp } from 'vue';

    // --- Utility Functions ---
    /**
     * Converts a Uint8Array to a string efficiently to avoid call stack limits.
     * Used internally for bytesToBase64.
     * @param {Uint8Array} bytes - The Uint8Array to convert.
     * @returns {string} - The converted string.
     */
    function uint8ArrayToString(bytes) {
        let result = '';
        const chunkSize = 16384; // Optimized chunk size for performance

        for (let i = 0; i < bytes.length; i += chunkSize) {
            const chunk = bytes.slice(i, i + chunkSize);
            result += String.fromCodePoint(...chunk);
        }
        return result;
    }

    /**
     * Converts a Uint8Array to a Base64 string.
     * @param {Uint8Array} bytes - The Uint8Array to convert.
     * @returns {string} - The Base64 string.
     */
    function bytesToBase64(bytes) {
        console.log("bytes length:", bytes.length);
        const binString = uint8ArrayToString(bytes);
        return btoa(binString);
    }

    // --- Vue Application ---
    createApp({
        data() {
            return {
                selectedServer: 'prod', // Default to 'prod'
                form : {
                    name : "",
                    fatherName : "",
                    mobile : "",
                    rollNumber : "",
                    role : "",
                    uniqueIdentifier : "",
                    dob : "",
                    address : "",
                    emailAddress : "",
                    projectId: "",   // New field
                    centerCode: "",  // New field
                    shiftDate: "",   // New field
                    image : "",     // Base64 string of image (without "data:image/jpeg;base64,")
                    signature : "", // Base64 string of signature (without "data:image/jpeg;base64,")
                },
                validQRBase64 : "",
                invalidQRBase64 : "",
                _validQRBase64Cache: "", // To store the valid QR data for toggling
                maxQRSize : "", // This was commented out in your original code, if you want to use it, uncomment it here and in payload.
                qrPartsCount: "", // Assuming this was meant to be part of data for v-model
                textOnlyQR: "",
                personPicture: "", // To store the person's picture returned from API
                score: null, // Added score field to data
                presetSetting : "", // Selected QR setting
                showInvalidQrExplicitly: false, // Control for showing invalid QR
            }
        },
        computed: {
            // Dynamically determine API_SERVER based on selectedServer
            API_SERVER() {
                return this.selectedServer === 'local' ? "http://localhost:8080" : "https://eqr.trustview.in"; // **IMPORTANT: Replace with your actual production URL**
            },
            API_URL() {
                return this.API_SERVER + "/api/secureqr/generateQRForPayload";
            },
            API_URL_INVALID() {
                return this.API_SERVER + "/api/secureqr/generateQRForPayloadInvalid";
            },
            AUTH_TOKEN() {
                return "MySecretKeyConfiguredForComputation"; // **Important: For production, this should be securely managed.**
            }
        },
        methods : {
            /**
             * Handles file input change for image uploads, converting to Base64.
             * @param {Event} e - The change event from the file input.
             * @param {string} type - 'image' or 'signature' to determine which form field to update.
             */
            handleFileUpload(e, type) {
                const selectedFile = e.target.files[0];
                if (!selectedFile) return;

                const reader = new FileReader();
                reader.onloadend = () => {
                    const rawBase64 = reader.result;
                    // Extract only the base64 part (after "base64,")
                    this.form[type] = rawBase64.split("base64,")[1];
                };
                reader.onerror = () => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: `Failed to read ${type} file!`
                    });
                };
                reader.readAsDataURL(selectedFile);
            },

            handleImage(e) {
                this.handleFileUpload(e, 'image');
            },

            handleSignature(e) {
                this.handleFileUpload(e, 'signature');
            },

            /**
             * Generates QR codes by sending form data to the API.
             */
            async createQR() {
                // Clear previous QR codes and reset visibility
                this.validQRBase64 = "";
                this.invalidQRBase64 = "";
                this.textOnlyQR = "";
                this.personPicture = "";
                this.score = null; // Reset score
                this._validQRBase64Cache = "";
                this.showInvalidQrExplicitly = false; // Reset to show valid QR initially

                const payload = {
                    inputPayload : bytesToBase64(new TextEncoder().encode(JSON.stringify(this.form))),
                    "usecase": "iitdemo24",
                    "border" : 1,
                    "qrLabel": "Demo",
                    "requestId": "DemoServer",
                    "qrVersion" : "base45",
                    "qrPartsCount" : this.qrPartsCount,
                    "imageCrop": "facecrop",
                    "presetSetting": this.presetSetting,
                    "maxQRSize" : this.maxQRSize
                    //"authToken": AUTH_TOKEN // If API requires it in payload
                };

                const headers = {
                    "authorization": this.AUTH_TOKEN, // Use computed AUTH_TOKEN
                    "Content-Type": "application/json" // Ensure correct content type
                };

                try {
                    // Generate Valid QR
                    const validQrResponse = await axios.post(this.API_URL, payload, { headers }); // Use computed API_URL
                    console.log("Valid QR Response:", validQrResponse.data);
                    this.validQRBase64 = validQrResponse.data.secureQRBase64String;
                    this._validQRBase64Cache = validQrResponse.data.secureQRBase64String; // Cache the valid QR
                    this.personPicture = validQrResponse.data.personPicture;
                    this.score = validQrResponse.data.score; // Assuming your API returns a 'score' field here
                    this.textOnlyQR = validQrResponse.data.secureQRBase64TextOnly;

                    // Generate Invalid QR (as a separate request)
                    const invalidQrResponse = await axios.post(this.API_URL_INVALID, payload, { headers }); // Use computed API_URL_INVALID
                    console.log("Invalid QR Response:", invalidQrResponse.data);
                    this.invalidQRBase64 = invalidQrResponse.data.secureQRBase64String;

                } catch (error) {
                    console.error("Error generating QR code:", error);
                    let errorMessage = 'Error generating QR code.';
                    if (error.response && error.response.data && error.response.data.message) {
                        errorMessage = error.response.data.message;
                    } else if (error.message) {
                        errorMessage = error.message;
                    }

                    Swal.fire({
                        icon: 'error',
                        title: 'API Error!',
                        text: errorMessage
                    });
                }
            },

            showInvalidQR() {
                this.showInvalidQrExplicitly = true;
                this.validQRBase64 = ""; // Disable valid QR
            },

            showValidQR() {
                this.showInvalidQrExplicitly = false;
                this.validQRBase64 = this._validQRBase64Cache; // Restore valid QR
            }
        }
    }).mount('#app');
</script>
</body>
</html>
